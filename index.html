<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correção de Avaliações</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; }
    input, select, button { padding: 8px; width: 100%; margin-top: 5px; }
    #camera { margin-top: 20px; text-align: center; }
    video, canvas { max-width: 100%; height: auto; }
    #aluno-info, #resultado, #acoes { margin-top: 20px; }
    .aluno { margin-bottom: 5px; }
    #impressao { display: none; }
  </style>
</head>
<body>
  <header>
    <h2>Secretaria de Educação de Tufilândia - MA</h2>
  </header>

  <form id="form-dados">
    <label>Nome da Escola: <input type="text" id="escola" required></label>
    <label>Ano: <input type="text" id="ano" required></label>
    <label>Turma: <input type="text" id="turma" required></label>
    <label>Componente Curricular: <input type="text" id="componente" required></label>
    <label>Nome do Aluno:
      <select id="lista-alunos">
        <option value="">Selecione um aluno</option>
        <option value="Ana Paula Mendes">Ana Paula Mendes - 12/03/1990 - Parda</option>
        <!-- demais opções -->
      </select>
    </label>
  </form>

  <div id="camera">
    <button onclick="trocarCamera()">Trocar Câmera</button><br>
    <video id="video" autoplay></video><br>
    <button onclick="tirarFoto()">Corrigir Prova</button>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div id="resultado">
    <h3>Resultado:</h3>
    <p id="res-nome"></p>
    <p id="res-acertos">Acertos: </p>
    <p id="res-erros">Erros: </p>
    <p id="res-percentual">Percentual de Acertos: </p>
  </div>

  <div id="acoes">
    <button onclick="window.print()">Imprimir</button>
    <button onclick="gerarPDF()">Gerar PDF</button>
    <button onclick="enviarEmail()">Enviar por E-mail</button>
  </div>

  <div id="impressao">
    <h3>Relatório de Correção</h3>
    <p id="imp-nome"></p>
    <p id="imp-escola"></p>
    <p id="imp-ano"></p>
    <p id="imp-turma"></p>
    <p id="imp-componente"></p>
    <p id="imp-acertos"></p>
    <p id="imp-erros"></p>
    <p id="imp-percentual"></p>
  </div>

  <script>
    let usandoFrontal = true;
    let stream;

    async function iniciarCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      const constraints = {
        video: { facingMode: usandoFrontal ? 'user' : 'environment' }
      };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('video').srcObject = stream;
    }

    function trocarCamera() {
      usandoFrontal = !usandoFrontal;
      iniciarCamera();
    }

    function tirarFoto() {
      const aluno = document.getElementById('lista-alunos').value;
      const escola = document.getElementById('escola').value;
      const ano = document.getElementById('ano').value;
      const turma = document.getElementById('turma').value;
      const componente = document.getElementById('componente').value;

      const acertos = Math.floor(Math.random() * 31);
      const erros = 30 - acertos;
      const percentual = ((acertos / 30) * 100).toFixed(2);

      document.getElementById('res-nome').textContent = `Aluno: ${aluno}`;
      document.getElementById('res-acertos').textContent = `Acertos: ${acertos}`;
      document.getElementById('res-erros').textContent = `Erros: ${erros}`;
      document.getElementById('res-percentual').textContent = `Percentual de Acertos: ${percentual}%`;

      document.getElementById('imp-nome').textContent = `Aluno: ${aluno}`;
      document.getElementById('imp-escola').textContent = `Escola: ${escola}`;
      document.getElementById('imp-ano').textContent = `Ano: ${ano}`;
      document.getElementById('imp-turma').textContent = `Turma: ${turma}`;
      document.getElementById('imp-componente').textContent = `Componente Curricular: ${componente}`;
      document.getElementById('imp-acertos').textContent = `Acertos: ${acertos}`;
      document.getElementById('imp-erros').textContent = `Erros: ${erros}`;
      document.getElementById('imp-percentual').textContent = `Percentual: ${percentual}%`;
    }

    function gerarPDF() {
      alert('Função de gerar PDF em desenvolvimento.');
    }

    function enviarEmail() {
      alert('Função de envio por e-mail em desenvolvimento.');
    }

    iniciarCamera();
  </script>
</body>
</html>
