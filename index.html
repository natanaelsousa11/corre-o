  <div id="camera">
    <button onclick="trocarCamera()">Trocar Câmera</button><br>

    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div id="resultado">
    <h3>Resultado:</h3>
    <p id="res-acertos">Acertos: </p>
    <p id="res-erros">Erros: </p>
    <p id="res-percentual">Percentual de Acertos: </p>
  </div>

  <div id="acoes">
    <button onclick="window.print()">Imprimir</button>
    <button onclick="gerarPDF()">Gerar PDF</button>
    <button onclick="enviarEmail()">Enviar por E-mail</button>
  </div>

  <script>
    let usandoFrontal = true;
    let stream;

    async function iniciarCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: { facingMode: usandoFrontal ? 'user' : 'environment' }
      };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('video').srcObject = stream;
    }

    function trocarCamera() {
      usandoFrontal = !usandoFrontal;
      iniciarCamera();
    }

    function tirarFoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      // Simula análise da imagem e retorna acertos
      const acertos = Math.floor(Math.random() * 30); // Exemplo: 30 questões
      const erros = 30 - acertos;
      const percentual = ((acertos / 30) * 100).toFixed(2);

      document.getElementById('res-acertos').textContent = `Acertos: ${acertos}`;
      document.getElementById('res-erros').textContent = `Erros: ${erros}`;
      document.getElementById('res-percentual').textContent = `Percentual de Acertos: ${percentual}%`;
    }

    function gerarPDF() {
      alert('Função de gerar PDF em desenvolvimento.');
    }

    function enviarEmail() {
      alert('Função de envio por e-mail em desenvolvimento.');
    }

    iniciarCamera();
  </script>
