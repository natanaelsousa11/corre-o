  <div class="camera-section">
    <h3>Correção via Câmera (Cartão Resposta)</h3>
    <button onclick="trocarCamera()">Alternar Câmera</button>
    <button onclick="tirarFoto()">Capturar Cartão</button>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <button onclick="lerCartao()">Corrigir Cartão</button>
  </div>

  <script>
    let usandoFrontal = false;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');

    async function iniciarCamera() {
      const constraints = {
        video: {
          facingMode: usandoFrontal ? 'user' : 'environment'
        }
      };
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        alert('Erro ao acessar a câmera');
      }
    }

    function trocarCamera() {
      usandoFrontal = !usandoFrontal;
      iniciarCamera();
    }

    function tirarFoto() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0);
    }

    function lerCartao() {
      Tesseract.recognize(canvas, 'por', {
        logger: m => console.log(m)
      }).then(({ data: { text } }) => {
        alert('Texto capturado:\n' + text);
        // Aqui você pode adicionar a lógica para comparar com o gabarito
      });
    }

    iniciarCamera();
  </script>
